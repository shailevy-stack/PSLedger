<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PS Central" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <title>PS Central</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-messaging-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
      --bg:#F2F2F7; --cell:#FFFFFF; --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
      --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08);
      --tint:#C8871A; --tint-soft:rgba(200,135,26,.14); --polina:#3A7BD5;
      --c-gold:#F5B700; --c-blue:#3A9BF0; --c-green:#34C759; --c-none:#8E8E93;
      --t-gold:rgba(245,183,0,.11); --t-blue:rgba(58,155,240,.10); --t-green:rgba(52,199,89,.10);
      --bar:rgba(249,249,249,.86); --menu:rgba(246,246,248,.94); --seg-on:#FFFFFF;
      --shadow-lift:0 18px 40px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.08);
      --green:#34C759; --red:#FF3B30;
      /* legacy names, mapped onto the new tokens */
      --ink:var(--label); --ink-light:var(--label2); --gold:var(--tint); --gold-light:var(--tint-soft);
      --blue:var(--polina); --paper:var(--bg); --card:var(--cell); --border:rgba(60,60,67,.22); --border-d:var(--sep);
      --st: env(safe-area-inset-top,0px); --sb: env(safe-area-inset-bottom,0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#000000; --cell:#1C1C1E; --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
        --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16);
        --tint:#F0A93B; --tint-soft:rgba(240,169,59,.18);
        --t-gold:rgba(245,183,0,.16); --t-blue:rgba(58,155,240,.18); --t-green:rgba(52,199,89,.16);
        --bar:rgba(22,22,24,.86); --menu:rgba(44,44,46,.94); --seg-on:#636366;
        --shadow-lift:0 18px 40px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.4);
        --border:rgba(84,84,88,.8);
      }
    }
    html,body { height:100%; background:var(--bg); font-family:var(--font); color:var(--label); -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; }
    #root { max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

    .sec-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-left:5px; flex-shrink:0; vertical-align:middle; background:var(--ink-light); }
    .sec-dot.local { background:#8a6a3a; animation:none; }
    .sec-dot.saving { background:var(--gold); animation:blink .5s infinite alternate; }
    .sec-dot.synced { background:var(--green); animation:none; }
    .sec-dot.new { background:var(--red); animation:none; }
    .sec-dot.pulling { background:var(--red); animation:blink .5s infinite alternate; }
    @keyframes blink { from{opacity:1} to{opacity:.15} }
    #section-ledger, #section-shopping, #section-blackboard { display:none; }
    #section-ledger.active, #section-shopping.active, #section-blackboard.active { display:block; }
    .board-input-row { display:flex; gap:8px; margin-bottom:16px; }
    .board-input { flex:1; font-size:16px; font-family:inherit; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--ink); padding:14px; outline:none; min-height:60px; resize:none; line-height:1.5; }
    .board-input:focus { border-color:var(--gold); }
    .board-note { border-radius:10px; border:2px solid var(--border-d); background:var(--card); margin-bottom:10px; overflow:hidden; transition:border-color .2s; user-select:none; display:flex; }
    .board-note.c-gold { border-color:#e8c96a; background:#fff8e6; }
    .board-note.c-blue { border-color:#8aafc9; background:#eef4f9; }
    .board-note.c-green { border-color:#8fbb9a; background:#eef5f0; }
    .board-note-handle { color:#ccc; font-size:18px; cursor:grab; padding:12px 8px 12px 10px; touch-action:none; flex-shrink:0; display:flex; align-items:flex-start; user-select:none; }
    .board-note-body { flex:1; padding:12px 12px 12px 0; min-width:0; }
    .board-note-text { font-size:15px; color:var(--ink); line-height:1.5; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; word-break:break-word; white-space:pre-wrap; }
    .board-note-text.expanded { display:block; -webkit-line-clamp:unset; }
    .board-note-text.editing { display:block; outline:none; border:none; background:transparent; width:100%; font-size:15px; font-family:inherit; color:var(--ink); line-height:1.5; resize:none; padding:0; min-height:60px; }
    .board-note-meta { font-size:11px; color:var(--ink-light); margin-top:6px; letter-spacing:.02em; }
    .board-note-actions { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .board-more { font-size:12px; color:var(--gold); cursor:pointer; border:none; background:none; font-family:inherit; padding:0; }
    .board-del { background:none; border:none; color:#ccc; font-size:18px; cursor:pointer; padding:0 12px; line-height:1; flex-shrink:0; align-self:center; }

    .body { padding:20px 18px calc(20px + var(--sb)); flex:1; }
    .tab-panel { display:none; } .tab-panel.active { display:block; }

    .form { display:flex; flex-direction:column; gap:18px; }
    .form-row { display:flex; flex-direction:column; gap:6px; overflow:hidden; }
    .label { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-light); }
    .amount-wrap { display:flex; align-items:baseline; gap:6px; border-bottom:2px solid var(--gold); padding:4px 0; }
    .amount-prefix { font-size:32px; font-family:inherit; color:var(--ink); line-height:1; }
    .amount-input { font-size:32px; font-family:inherit; border:none; background:transparent; color:var(--ink); outline:none; width:100%; padding:0; }
    .text-input { font-size:16px; font-family:inherit; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--ink); padding:10px 12px; outline:none; width:100%; }
    .text-input:focus { border-color:var(--gold); }
    select.text-input { appearance:auto; }
    .cat-label-row { display:flex; align-items:center; justify-content:space-between; }
    .auto-hint { font-size:11px; color:var(--gold); font-style:italic; display:none; }
    .select-hi { border-color:var(--gold) !important; background:var(--gold-light) !important; }
    .date-tabs { display:flex; gap:8px; }
    .date-tab { flex:1; padding:9px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--ink-light); font-size:14px; font-family:inherit; cursor:pointer; }
    .date-tab.active { background:var(--tint); color:#fff; border-color:var(--tint); }
    .submit-btn { padding:15px; background:var(--tint); color:#fff; border:none; border-radius:8px; font-size:16px; font-family:inherit; cursor:pointer; letter-spacing:.04em; transition:background .2s; width:100%; }
    .submit-btn:disabled { opacity:.5; cursor:default; }
    .btn-disabled { opacity:.5; pointer-events:none; }
    .submit-btn.saved { background:var(--green); }

    .date-group { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-light); margin-top:16px; margin-bottom:6px; border-bottom:1px solid var(--border-d); padding-bottom:4px; }
    .expense-row { display:flex; align-items:center; justify-content:space-between; padding:11px 12px; border-radius:8px; margin-bottom:6px; background:var(--card); border:1px solid var(--border-d); }
    .expense-row.editing { background:var(--cell); border-color:var(--tint); }
    .edit-form { display:flex; flex-direction:column; gap:8px; padding:4px 0; width:100%; max-width:100%; box-sizing:border-box; }
    .edit-row-inputs { display:flex; gap:6px; }
    .edit-amt { font-size:16px; font-family:inherit; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--ink); padding:7px 10px; width:80px; outline:none; }
    .edit-desc { font-size:16px; font-family:inherit; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--ink); padding:7px 10px; flex:1; outline:none; }
    .edit-cat { font-size:16px; font-family:inherit; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--ink); padding:7px 10px; width:100%; outline:none; }
    .edit-date-row { display:flex; gap:6px; align-items:center; }
    .edit-date-tab { flex:1; padding:6px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--ink-light); font-size:16px; font-family:inherit; cursor:pointer; text-align:center; }
    .edit-date-tab.active { background:var(--tint); color:#fff; border-color:var(--tint); }
    .edit-date-display { font-size:16px; color:var(--ink-light); padding:4px 0; }
    .edit-actions { display:flex; gap:6px; }
    .edit-save { flex:1; padding:8px; background:var(--tint); color:#fff; border:none; border-radius:6px; font-size:13px; font-family:inherit; cursor:pointer; }
    .edit-cancel { padding:8px 14px; background:none; border:1px solid var(--border); color:var(--ink-light); border-radius:6px; font-size:13px; font-family:inherit; cursor:pointer; }
    .expense-row.saving { opacity:0.5; filter:grayscale(1); transition:opacity 0.2s, filter 0.2s; }
    .expense-row.save-done { opacity:1; filter:grayscale(0); transition:opacity 0.4s, filter 0.4s; }
    .expense-row.theirs { border-left:3px solid var(--blue); }
    .expense-left { display:flex; align-items:center; gap:10px; }
    .expense-cat { font-size:22px; }
    .expense-desc { font-size:15px; color:var(--ink); }
    .expense-person { font-size:12px; color:var(--ink-light); margin-top:2px; }
    .expense-right { display:flex; align-items:center; gap:8px; }
    .expense-amt { font-size:17px; color:var(--ink); font-weight:bold; }
    .delete-btn { background:none; border:none; color:#ccc; font-size:20px; cursor:pointer; padding:2px; line-height:1; }
    .sync-row { display:flex; align-items:center; gap:10px; margin-top:16px; }
    .sync-btn { background:none; border:1px solid var(--border); border-radius:6px; padding:7px 14px; color:var(--ink-light); font-size:13px; font-family:inherit; cursor:pointer; }
    .sync-note { font-size:12px; color:#bbb; font-style:italic; }

    .balance-total { background:var(--tint); color:#fff; border-radius:10px; padding:20px; margin-bottom:16px; text-align:center; }
    .balance-total-label { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.8); }
    .balance-total-amt { font-size:38px; margin:6px 0 2px; }
    .balance-fair { font-size:13px; color:rgba(255,255,255,.8); }
    .balance-card { background:var(--card); border:1px solid var(--border-d); border-radius:10px; padding:16px; margin-bottom:10px; }
    .balance-card.me { border-color:var(--gold); background:var(--gold-light); }
    .balance-name { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-light); }
    .balance-spent { font-size:22px; color:var(--ink); margin:4px 0 6px; }
    .balance-status { font-size:15px; font-style:italic; }
    .verdict { text-align:center; background:var(--fill); border:1px dashed var(--gold); border-radius:8px; padding:14px; color:var(--ink); font-size:16px; font-style:italic; margin-top:6px; margin-bottom:16px; }

    .range-tabs { display:flex; gap:6px; margin-bottom:16px; }
    .range-tab { flex:1; padding:8px 0; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--ink-light); font-size:13px; font-family:inherit; cursor:pointer; }
    .range-tab.active { background:var(--tint); color:#fff; border-color:var(--tint); }
    .insights-period { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-light); margin-bottom:14px; }
    .insight-row { margin-bottom:18px; }
    .insight-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
    .insight-label { display:flex; align-items:center; gap:7px; }
    .insight-emoji { font-size:18px; }
    .insight-name { font-size:15px; color:var(--ink); }
    .insight-amt-block { display:flex; align-items:baseline; gap:6px; }
    .insight-amt { font-size:15px; color:var(--ink); font-weight:bold; }
    .insight-pct { font-size:12px; color:#aaa; }
    .bar-track { height:8px; background:var(--fill); border-radius:4px; display:flex; overflow:hidden; margin-bottom:5px; }
    .bar-seg { height:100%; }
    .insight-people { display:flex; gap:12px; }
    .insight-chip { font-size:12px; font-style:italic; }
    .legend { display:flex; gap:16px; margin-top:20px; padding-top:14px; border-top:1px solid var(--border-d); }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-light); }
    .legend-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

    .screen { min-height:100vh; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:var(--card); border:1px solid var(--border-d); border-radius:16px; padding:44px 32px 32px; width:100%; max-width:340px; box-shadow:0 4px 24px rgba(44,36,22,.08); }
    .card-center { text-align:center; }
    .big-emoji { font-size:48px; margin-bottom:16px; }
    .card-title { font-size:28px; color:var(--ink); margin:0 0 0; font-weight:normal; letter-spacing:0.02em; }
    .card-sub { font-size:15px; color:var(--ink-light); margin:0 0 28px; }
    .pick-buttons { display:flex; flex-direction:column; gap:12px; }
    .pick-btn { padding:14px; background:var(--tint); color:#fff; border:none; border-radius:8px; font-size:17px; font-family:inherit; cursor:pointer; }
    .error-msg { font-size:12px; color:var(--red); margin-top:8px; line-height:1.5; }
    .reset-btn { margin-top:20px; background:none; border:1px solid var(--border); color:var(--ink-light); border-radius:6px; padding:6px 14px; cursor:pointer; font-family:inherit; font-size:12px; }
    .empty { text-align:center; color:#aaa; margin-top:40px; font-style:italic; }
    .err-text { text-align:center; color:var(--red); margin-top:40px; font-style:italic; }

    /* ── App frame: large titles, bottom tab bar, segmented control ─────────── */
    #app-shell { padding-bottom:calc(64px + var(--sb)); }
    .topbar { padding-top:var(--st); }
    .navrow { display:flex; justify-content:flex-end; align-items:center; height:44px; padding:0 16px; }
    .avatar { width:32px; height:32px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-weight:600; font-size:14px; flex-shrink:0; }
    .avatar.av-a { background:linear-gradient(160deg,#E2A53A,#B87414); }
    .avatar.av-b { background:linear-gradient(160deg,#5C9BEA,#2F67C2); }
    .avatar-btn { background:none; border:none; padding:0; border-radius:50%; cursor:pointer; transition:transform .15s; }
    .avatar-btn:active { transform:scale(.88); }
    .large-title { font-size:34px; font-weight:700; letter-spacing:.01em; line-height:41px; padding:0 20px; }
    .large-sub { font-size:15px; color:var(--label2); padding:2px 20px 0; display:flex; align-items:center; gap:7px; min-height:20px; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(52,199,89,.2); flex-shrink:0; transition:background .2s, box-shadow .2s; }
    .live-dot.saving { background:var(--tint); box-shadow:0 0 0 3px var(--tint-soft); animation:blink .5s infinite alternate; }
    .live-dot.new, .live-dot.pulling { background:var(--red); box-shadow:0 0 0 3px rgba(255,59,48,.2); }
    .live-dot.local { background:var(--c-none); box-shadow:none; }

    .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; padding:7px 0 calc(var(--sb) + 4px); background:var(--bar); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); border-top:.5px solid var(--sep); z-index:50; }
    .tab { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:#8E8E93; font-family:inherit; font-size:10px; font-weight:500; position:relative; cursor:pointer; padding:0; transition:transform .15s, color .2s; }
    .tab:active { transform:scale(.9); }
    .tab.on { color:var(--tint); }
    .tab svg { width:28px; height:28px; }
    .tab .sec-dot { position:absolute; top:0; left:calc(50% + 9px); width:10px; height:10px; margin:0; box-shadow:0 0 0 2px var(--cell); }
    .tab .sec-dot.synced { display:none; }

    .seg { position:relative; display:flex; margin:12px 16px 0; background:var(--fill); border-radius:9px; padding:2px; height:34px; }
    .seg-thumb { position:absolute; top:2px; bottom:2px; left:2px; width:calc((100% - 4px) / 4); background:var(--seg-on); border-radius:7px; box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04); transition:transform .32s cubic-bezier(.3,1.25,.5,1); }
    .seg-btn { flex:1; position:relative; z-index:1; background:none; border:none; font-family:inherit; font-size:13px; font-weight:500; color:var(--label); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
    .seg-btn.active { font-weight:600; }
    .seg-btn .sec-dot { width:6px; height:6px; margin-left:4px; }
    .seg-btn .sec-dot.synced { display:none; }
    .shop-add-btn { padding:0; width:44px; flex-shrink:0; background:var(--tint); color:#fff; border:none; border-radius:12px; font-size:24px; cursor:pointer; transition:transform .15s; }
    .shop-add-btn:active { transform:scale(.92); }

    /* ── Inset grouped lists ─────────────────────────────────────────────────── */
    .group { margin:0 16px 22px; background:var(--cell); border-radius:12px; }
    .group-head { display:flex; justify-content:space-between; align-items:center; padding:0 20px 6px; }
    .group-toggle { background:none; border:none; font-family:inherit; font-size:13px; text-transform:uppercase; letter-spacing:.02em; color:var(--label2); display:flex; align-items:center; gap:4px; padding:6px 0; cursor:pointer; }
    .group-toggle svg { transition:transform .25s; }
    .group-toggle.collapsed svg { transform:rotate(-90deg); }
    .group-action { background:none; border:none; color:var(--tint); font-family:inherit; font-size:15px; cursor:pointer; padding:6px 0; }
    .addfield { margin:16px 16px 22px; background:var(--cell); border-radius:12px; display:flex; align-items:center; gap:8px; padding:0 10px 0 16px; height:52px; }
    .add-input { flex:1; border:none; background:transparent; font-family:inherit; font-size:17px; color:var(--label); outline:none; min-width:0; height:100%; }
    .add-input::placeholder { color:var(--label3); }
    .add-btn { width:32px; height:32px; border-radius:50%; background:var(--tint); border:none; display:grid; place-items:center; color:#fff; cursor:pointer; flex-shrink:0; padding:0; transition:transform .15s; }
    .add-btn:active { transform:scale(.85); }
    .empty-state { text-align:center; color:var(--label2); padding:48px 0; font-size:17px; }
    .empty-state .empty-emoji { font-size:44px; margin-bottom:10px; }

    /* ── Tactile rows (swipe, lift, drag) ────────────────────────────────────── */
    .srow { position:relative; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    .srow:first-child { border-top-left-radius:12px; border-top-right-radius:12px; }
    .srow:last-child { border-bottom-left-radius:12px; border-bottom-right-radius:12px; }
    .srow-front { position:relative; z-index:2; display:flex; align-items:center; gap:12px; min-height:52px; padding:0 14px 0 14px; background:var(--cell); touch-action:pan-y; }
    .srow.c-gold .srow-front { background:linear-gradient(var(--t-gold),var(--t-gold)), var(--cell); }
    .srow.c-blue .srow-front { background:linear-gradient(var(--t-blue),var(--t-blue)), var(--cell); }
    .srow.c-green .srow-front { background:linear-gradient(var(--t-green),var(--t-green)), var(--cell); }
    .srow + .srow .srow-front::before { content:""; position:absolute; top:0; left:52px; right:0; height:.5px; background:var(--sep); }
    .srow.pressing .srow-front { transform:scale(.985); transition:transform .25s ease-out; }
    .scheck { width:26px; height:26px; border-radius:50%; border:2px solid var(--label3); background:transparent; flex-shrink:0; display:grid; place-items:center; cursor:pointer; padding:0; position:relative; transition:background .2s, border-color .2s; }
    .scheck::before { content:""; position:absolute; inset:-12px; }
    .scheck::after { content:""; width:6px; height:11px; border:solid #fff; border-width:0 2.4px 2.4px 0; transform:translateY(-1px) rotate(45deg) scale(0); transition:transform .22s cubic-bezier(.3,1.6,.5,1); }

let _authReady=null;
function ensureAuth(){
  if(!_authReady){
    _authReady=new Promise((resolve,reject)=>{
      const unsub=firebase.auth().onAuthStateChanged(user=>{ if(user){ unsub(); resolve(user); } }, reject);
      firebase.auth().signInAnonymously().catch(reject);

// ── Firestore helpers ─────────────────────────────────────────────────────────
async function fsWrite(section, data) {
  await db.collection("sections").doc(section).set({

    updatedBy: S.user || "unknown"

      method: "POST",

}

// ── Learning ──────────────────────────────────────────────────────────────────
function tok(t){return t.toLowerCase().replace(/[^a-zäöüßа-яёà-ž\s]/g,"").split(/\s+/).filter(w=>w.length>2);}
function inferCat(mem,desc){
  if(!desc.trim()||!mem||!Object.keys(mem).length) return null;
  const words=tok(desc); if(!words.length) return null;
  const sc={}; CATS.forEach(c=>sc[c]=0);
  words.forEach(w=>{if(mem[w])Object.entries(mem[w]).forEach(([c,n])=>{sc[c]=(sc[c]||0)+n;});});
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  return best&&best[1]>0?best[0]:null;
}
function learn(mem,desc,cat){
  const u={...mem};
  tok(desc).forEach(w=>{if(!u[w])u[w]={};u[w][cat]=(u[w][cat]||0)+1;});
  return u;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){
  const d=new Date(iso+"T12:00:00"),t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "Today";
  if(d.toDateString()===y.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
}
function el(id){return document.getElementById(id);}
function mk(tag,attrs,...kids){
  const e=document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==="cls") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  kids.forEach(c=>{if(c==null||c===false)return;e.append(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}

function showBrowserNotification(title, body) {
  if (Notification.permission === "granted") {
    new Notification(title, { body, icon: "apple-touch-icon.png" });
  }
}

// ── State ─────────────────────────────────────────────────────────────────────
let S={
  user: ls.get("lb_user"),
  section: ls.get("lb_section")||"ledger",
  expenses:[], memory:{}, shopping:[], blackboard:[], insightsRange:"month", insightsView:"category",
  trendsActiveCats:null, meta:{},
  loading:true, loadErr:"",
};
let writeLock=false;
let updateLogBtn=null;
let _listeners=[];

// ── Firestore real-time listeners ─────────────────────────────────────────────
let _lastSeenExpenseCount=0;
let _lastSeenShoppingHash=null;
let _lastSeenBoardHash=null;
let _shopDirty=false;
let _boardDirty=false;
let _shopAutoTimer=null;
let _boardAutoTimer=null;

let _relistenTimer=null;
function scheduleRelisten(){
  if(_relistenTimer) return;
  _relistenTimer=setTimeout(()=>{ _relistenTimer=null; startListeners(); }, 3000);
}

function startListeners() {
  _listeners.forEach(u => u());
  _listeners = [];

  const expUnsub = db.collection("sections").doc("expenses").onSnapshot(snap => {
    if (!snap.exists) { S.loading=false; S.loadErr=""; refreshHistory(); return; }
    const d = snap.data();
    let parsed;
    try { parsed = JSON.parse(d.data); } catch(e) { parsed = []; }
    S.expenses = Array.isArray(parsed) ? parsed : [];
    const fromMe = d.updatedBy === S.user;

    if (!fromMe && _lastSeenExpenseCount > 0 && S.expenses.length > _lastSeenExpenseCount) {
      setDot("dot-ledger","new"); setDot("dot-history","new");
      showBrowserNotification("PS Central", (d.updatedBy||"Someone")+" added an expense");
    } else if (_lastSeenExpenseCount === 0) {
      _lastSeenExpenseCount = S.expenses.length;
      setDot("dot-ledger","synced"); setDot("dot-history","synced");
    } else if (fromMe) {
      _lastSeenExpenseCount = S.expenses.length;
      setDot("dot-ledger","synced"); setDot("dot-history","synced");
    }

    S.loading=false; S.loadErr="";
    refreshHistory(); refreshBalance(); refreshInsights();
    if (updateLogBtn) updateLogBtn();
  }, err => { S.loading=false; S.loadErr=err.message; refreshHistory(); scheduleRelisten(); });

  const memUnsub = db.collection("sections").doc("memory").onSnapshot(snap => {
    if (!snap.exists) return;
    try { S.memory = JSON.parse(snap.data().data) || {}; } catch(e) {}
  }, err => { scheduleRelisten(); });

  const shopUnsub = db.collection("sections").doc("shopping").onSnapshot(snap => {
    if (!snap.exists) { rebuildShopList(); return; }
    const d = snap.data();
    const fromMe = d.updatedBy === S.user;
    if (_shopDirty && !fromMe) return;
    let parsed;
    try { parsed = JSON.parse(d.data); } catch(e) { parsed = []; }
    S.shopping = Array.isArray(parsed) ? parsed : [];
    const newHash = S.shopping.map(i=>i.id+i.done+i.color).join("|");
    if (!fromMe && _lastSeenShoppingHash !== null && newHash !== _lastSeenShoppingHash) {
      setDot("dot-shopping","new");
      showBrowserNotification("PS Central", (d.updatedBy||"Someone")+" updated the shopping list");
    } else {
      setDot("dot-shopping","synced");
    }
    if (fromMe || _lastSeenShoppingHash === null) _lastSeenShoppingHash = newHash;
    rebuildShopList();

    const today=todayStr();
    const lastClear=ls.get("shop_clear_date");
    if(lastClear && lastClear!==today){
      const cleared=S.shopping.filter(i=>!i.done);
      if(cleared.length!==S.shopping.length){ S.shopping=cleared; fsWrite("shopping",cleared); }
      ls.set("shop_clear_date",today);
    } else if(!lastClear) ls.set("shop_clear_date",today);
  }, err => { scheduleRelisten(); });

  const boardUnsub = db.collection("sections").doc("blackboard").onSnapshot(snap => {
    if (!snap.exists) { rebuildBoard(); return; }
    const d = snap.data();
    const fromMe = d.updatedBy === S.user;
    if (_boardDirty && !fromMe) return;
    let parsed;
    try { parsed = JSON.parse(d.data); } catch(e) { parsed = []; }
    S.blackboard = Array.isArray(parsed) ? parsed : [];
    const newHash = S.blackboard.map(n=>n.id+n.text+n.color).join("|");
    if (!fromMe && _lastSeenBoardHash !== null && newHash !== _lastSeenBoardHash) {
      setDot("dot-board","new");
      showBrowserNotification("PS Central", (d.updatedBy||"Someone")+" updated the board");
    } else {
      setDot("dot-board","synced");
    }
    if (fromMe || _lastSeenBoardHash === null) _lastSeenBoardHash = newHash;
    rebuildBoard();
  }, err => { scheduleRelisten(); });

  const metaUnsub = db.collection("sections").doc("meta").onSnapshot(snap => {
    if (!snap.exists) return;
    try { const d=snap.data(); S.meta=d.data?JSON.parse(d.data):{}; } catch(e) { S.meta={}; }
    refreshBalance();
  }, err => { scheduleRelisten(); });

  _listeners = [expUnsub, memUnsub, shopUnsub, boardUnsub, metaUnsub];
}

function stopListeners() {
  _listeners.forEach(u => u());
  _listeners = [];
}

// ── FCM setup ─────────────────────────────────────────────────────────────────
async function setupFCM() {
  if (!messaging || !S.user) return;
  try {
    if (!("serviceWorker" in navigator)) return;
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) {
      await db.collection("users").doc(S.user).set({
        fcmToken: token,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
    messaging.onMessage(payload => {
      const t = (payload.notification && payload.notification.title) || "PS Central";
      const b = (payload.notification && payload.notification.body) || "New update";
      showBrowserNotification(t, b);
    });
  } catch(e) {
    console.warn("FCM setup:", e.message);
  }
}

// ── Dot system ────────────────────────────────────────────────────────────────
function setDot(id, state){
  const d=el(id); if(d) d.className="sec-dot "+state;
  document.querySelectorAll(`[data-dot="${id}"]`).forEach(n=>n.className="live-dot "+state);
}

// ── Write helpers ─────────────────────────────────────────────────────────────
async function freshWrite(fn){
  if(writeLock)return; writeLock=true;
  setDot("dot-ledger","saving");
  try{
    const expRef=db.collection("sections").doc("expenses");
    const memRef=db.collection("sections").doc("memory");
    let next;
    await db.runTransaction(async tx=>{
      const [expSnap,memSnap]=await Promise.all([tx.get(expRef),tx.get(memRef)]);
      let curExpenses=[]; if(expSnap.exists){try{curExpenses=JSON.parse(expSnap.data().data)||[];}catch(e){curExpenses=[];}}
      let curMemory={}; if(memSnap.exists){try{curMemory=JSON.parse(memSnap.data().data)||{};}catch(e){curMemory={};}}
      next=fn(curExpenses, curMemory, S.shopping);
      const stamp={updatedAt:firebase.firestore.FieldValue.serverTimestamp(), updatedBy:S.user||"unknown"};
      tx.set(expRef, {data:JSON.stringify(next.expenses), ...stamp});
      tx.set(memRef, {data:JSON.stringify(next.memory), ...stamp});
    });
    S.expenses=next.expenses; S.memory=next.memory; S.shopping=next.shopping||S.shopping;
    refreshHistory(); refreshBalance(); refreshInsights(); rebuildShopList();
    if(updateLogBtn) updateLogBtn();
    setDot("dot-ledger","synced");
    sheetsLog(S.expenses);
    notifyPartner("PS Central", S.user+" added an expense");
  }catch(e){ alert("Save failed: "+e.message); setDot("dot-ledger","local"); }
  writeLock=false;
}

async function shopWrite(newShopping){
  S.shopping=newShopping; _shopDirty=true;
  rebuildShopList();
  shopCommit();
}
async function shopCommit(){
  if(_shopAutoTimer){clearTimeout(_shopAutoTimer);_shopAutoTimer=null;}
  if(!_shopDirty) return;
  setDot("dot-shopping","saving");
  try{
    await fsWrite("shopping", S.shopping);
    _shopDirty=false;
    _lastSeenShoppingHash=S.shopping.map(i=>i.id+i.done+i.color).join("|");
    setDot("dot-shopping","synced");
    notifyPartner("PS Central", S.user+" updated the shopping list");
  }catch(e){
    _shopDirty=false;
    setDot("dot-shopping","local"); alert("Save failed: "+e.message);
  }
}

async function boardWrite(newBoard){
  S.blackboard=newBoard; _boardDirty=true;
  rebuildBoard();
  boardCommit();
}
async function boardCommit(){
  if(_boardAutoTimer){clearTimeout(_boardAutoTimer);_boardAutoTimer=null;}
  if(!_boardDirty) return;
  setDot("dot-board","saving");
  try{
    await fsWrite("blackboard", S.blackboard);
    _boardDirty=false;
    _lastSeenBoardHash=S.blackboard.map(n=>n.id+n.text+n.color).join("|");
    setDot("dot-board","synced");
    notifyPartner("PS Central", S.user+" updated the board");
  }catch(e){
    _boardDirty=false;
    setDot("dot-board","local"); alert("Save failed: "+e.message);
  }
}

        mk("div",{style:"font-size:11px;color:#bbb;letter-spacing:0.08em;margin-top:8px;"},"v6.0"),

    )
  );
}

// Light tap feedback. Android: Vibration API. iOS Safari has no vibration API,
// but toggling a native <input switch> (iOS 18+) plays the system haptic.
const haptic=(()=>{
  let lbl=null;
  return ()=>{
    try{
      if(navigator.vibrate){ navigator.vibrate(8); return; }
      if(!lbl){
        const inp=document.createElement("input"); inp.type="checkbox"; inp.setAttribute("switch","");
        lbl=document.createElement("label"); lbl.setAttribute("aria-hidden","true");
        lbl.style.cssText="position:fixed;left:-200px;top:0;opacity:0;pointer-events:none;";
        lbl.append(inp); document.body.append(lbl);
      }
      lbl.click();
    }catch(e){}
  };
})();

let _toastEl=null,_toastTimer=null;
function toast(msg,actionLabel,onAction){
  if(_toastEl){ _toastEl.remove(); clearTimeout(_toastTimer); }
  const t=mk("div",{cls:"toast",role:"status"},mk("span",{},msg),
    actionLabel?mk("button",{onClick:()=>{hide();onAction();}},actionLabel):null);
  function hide(){ t.classList.remove("show"); setTimeout(()=>t.remove(),320); if(_toastEl===t)_toastEl=null; }
  document.body.append(t); _toastEl=t;
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add("show")));
  _toastTimer=setTimeout(hide,4500);
}

// FLIP: snapshot row positions before a re-render, then glide rows from old to new spots.
function flipSnapshot(root){ const m={}; root.querySelectorAll("[data-id]").forEach(n=>m[n.dataset.id]=n.getBoundingClientRect().top); return m; }
function flipPlay(root,prev){
  const had=Object.keys(prev).length>0;
  root.querySelectorAll("[data-id]").forEach(n=>{
    const old=prev[n.dataset.id];
    if(old===undefined){
      if(had){ n.classList.add("row-enter"); n.addEventListener("animationend",()=>n.classList.remove("row-enter"),{once:true}); }
      return;
    }
    const dy=old-n.getBoundingClientRect().top;
    if(Math.abs(dy)<1) return;
    n.style.transition="none"; n.style.transform=`translateY(${dy}px)`; n.style.zIndex="3";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      n.style.transition="transform .4s cubic-bezier(.2,.85,.25,1)"; n.style.transform="";
      setTimeout(()=>{ n.style.transition=""; n.style.zIndex=""; },420);
    }));
  });
}

function collapseRow(row,cb){
  row.style.height=row.offsetHeight+"px"; row.style.pointerEvents="none";
  requestAnimationFrame(()=>{
    row.style.transition="height .28s cubic-bezier(.4,0,.2,1), opacity .2s";
    row.style.height="0px"; row.style.opacity="0";
  });
  setTimeout(cb,290);
}

// ── History ───────────────────────────────────────────────────────────────────
function refreshHistory(){
  const hb=el("hist-body"); if(!hb)return;
  if(hb.querySelector(".expense-row.editing")) return;
  hb.innerHTML="";
  if(S.loading){hb.append(mk("p",{cls:"empty"},"Loading…"));return;}
  if(S.loadErr){hb.append(mk("p",{cls:"err-text"},S.loadErr));return;}
  if(!S.expenses.length){hb.append(mk("p",{cls:"empty"},"No expenses yet."));return;}
  const grouped={};
  S.expenses.forEach(e=>{if(!grouped[e.date])grouped[e.date]=[];grouped[e.date].push(e);});
  Object.entries(grouped).sort(([a],[b])=>b.localeCompare(a)).forEach(([date,items])=>{
    items.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    hb.append(mk("div",{cls:"date-group"},fmtDate(date)));
    items.forEach(e=>{
      const isMine=e.person===S.user;
      const row=mk("div",{cls:"expense-row "+(isMine?"mine":"theirs"),style:"user-select:none;"});

      function buildNormalView(){
        row.innerHTML=""; row.className="expense-row "+(isMine?"mine":"theirs"); row.style.userSelect="none";
        row.append(
          mk("div",{cls:"expense-left"},
            mk("span",{cls:"expense-cat"},e.category.split(" ")[0]),
            mk("div",{},mk("div",{cls:"expense-desc"},e.description),mk("div",{cls:"expense-person"},isMine?"You":e.person)),
          ),
          mk("div",{cls:"expense-right"},
            mk("span",{cls:"expense-amt"},"€"+e.amount.toFixed(2)),
            isMine?mk("button",{cls:"delete-btn",onClick:(ev)=>{ev.stopPropagation();freshWrite((ex,m,sh)=>({expenses:ex.filter(x=>x.id!==e.id),memory:m,shopping:sh}));}},"×"):null,
          ),
        );
        if(isMine) attachLongPress(row);
      }

      function attachLongPress(el){
        let timer=null;
        el.addEventListener("touchstart",()=>{timer=setTimeout(()=>buildEditView(),600);},{passive:true});
        el.addEventListener("touchend",()=>{clearTimeout(timer);});
        el.addEventListener("touchmove",()=>{clearTimeout(timer);});
      }

      function buildEditView(){
        row.innerHTML=""; row.className="expense-row editing";
        let editAmt=e.amount.toString(),editDesc=e.description,editCat=e.category;
        let editDateMode=e.date===todayStr()?"today":"manual",editDate=e.date;
        const amtIn=mk("input",{cls:"edit-amt",type:"number",value:editAmt,inputmode:"decimal",onInput:ev=>editAmt=ev.target.value});
        const descIn=mk("input",{cls:"edit-desc",type:"text",value:editDesc,onInput:ev=>editDesc=ev.target.value});
        const catSel=mk("select",{cls:"edit-cat",onChange:ev=>editCat=ev.target.value},
          ...CATS.map(c=>Object.assign(mk("option",{value:c},c),{selected:c===editCat}))
        );
        const dateDisplay=mk("div",{cls:"edit-date-display"},fmtDate(editDate));
        const editDatePick=mk("input",{type:"date",value:editDate,
          style:"position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;",
          onChange:ev=>{if(!ev.target.value)return;editDate=ev.target.value;editDateMode="manual";todayTabE.className="edit-date-tab";manualTabE.className="edit-date-tab active";dateDisplay.textContent=fmtDate(ev.target.value);}
        });
        const todayTabE=mk("button",{cls:"edit-date-tab"+(editDateMode==="today"?" active":""),type:"button",onClick:()=>{
          editDateMode="today";editDate=todayStr();
          todayTabE.className="edit-date-tab active";manualTabE.className="edit-date-tab";
          dateDisplay.textContent="Today";
        }},"Today");
        const manualTabE=mk("div",{cls:"edit-date-tab"+(editDateMode==="manual"?" active":""),style:"position:relative;cursor:pointer;"},"Pick date");
        manualTabE.appendChild(editDatePick);
        const saveBtn=mk("button",{cls:"edit-save",onClick:async()=>{
          const amt=parseFloat(editAmt);
          if(!amt||amt<=0||!editDesc.trim()) return;
          e.amount=amt; e.description=editDesc.trim(); e.category=editCat; e.date=editDate;
          buildNormalView();
          row.className="expense-row "+(isMine?"mine":"theirs")+" saving";
          await freshWrite((exps,mem,sh)=>({
            expenses:exps.map(x=>x.id===e.id?{...x,amount:amt,description:editDesc.trim(),category:editCat,date:editDate}:x)
                        .sort((a,b)=>b.date.localeCompare(a.date)),
            memory:mem, shopping:sh,
          }));
          row.className="expense-row "+(isMine?"mine":"theirs")+" save-done";
          setTimeout(()=>{row.className="expense-row "+(isMine?"mine":"theirs");},600);
        }},"✓ Save");
        const cancelBtn=mk("button",{cls:"edit-cancel",onClick:()=>buildNormalView()},"Cancel");
        row.append(mk("div",{cls:"edit-form"},
          mk("div",{cls:"edit-row-inputs"},amtIn,descIn),catSel,
          mk("div",{cls:"edit-date-row"},todayTabE,manualTabE),dateDisplay,
          mk("div",{cls:"edit-actions"},saveBtn,cancelBtn),
        ));
      }

      buildNormalView();
      hb.append(row);
    });
  });
}

function refreshBalance(){
  const bp=el("tab-balance"); if(!bp)return;
  bp.innerHTML="";
  const since=S.meta&&S.meta.lastSettlement;
  const expenses=since?S.expenses.filter(e=>e.date>=since):S.expenses;
  const totals=PEOPLE.reduce((a,p)=>{a[p]=expenses.filter(e=>e.person===p).reduce((s,e)=>s+e.amount,0);return a;},{});
  const grand=Object.values(totals).reduce((s,v)=>s+v,0);
  const fair=grand/2;
  const bal=PEOPLE.reduce((a,p)=>{a[p]=totals[p]-fair;return a;},{});
  const partner=PEOPLE.find(p=>p!==S.user);

  const header=mk("div",{cls:"balance-total"},

function renderTrends(ip){
  const now=new Date();

  // Category toggle chips (2-column grid)
  const activeCats=S.trendsActiveCats===null?new Set(CATS):new Set(S.trendsActiveCats);
  const chipGrid=mk("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;"});
  CATS.forEach(cat=>{
    const color=CAT_COLORS[cat]||"#9e9e9e";
    const isActive=activeCats.has(cat);
    chipGrid.append(mk("button",{
      style:`display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1.5px solid ${isActive?color:"var(--border)"};background:${isActive?color+"22":"transparent"};cursor:pointer;font-family:inherit;font-size:12px;color:${isActive?"var(--ink)":"var(--label3)"};text-align:left;width:100%;`,
      onClick:()=>{
        const cur=S.trendsActiveCats===null?new Set(CATS):new Set(S.trendsActiveCats);
        if(cur.has(cat)){if(cur.size>1)cur.delete(cat);}else cur.add(cat);
        S.trendsActiveCats=[...cur];
        refreshInsights();
      }
    },
      mk("span",{style:`width:10px;height:10px;border-radius:2px;background:${isActive?color:"var(--border)"};flex-shrink:0;display:inline-block`}),
      cat
    ));
  });
  ip.append(chipGrid);

  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({year:d.getFullYear(),month:d.getMonth(),
      label:d.toLocaleDateString("en-GB",{month:"short"})+"'"+String(d.getFullYear()).slice(2)});
  }

  const data=months.map(m=>{
    const byCat={},byPerson={};
    PEOPLE.forEach(p=>byPerson[p]=0);
    S.expenses.forEach(e=>{
      const d=new Date(e.date+"T12:00:00");
      if(d.getFullYear()===m.year&&d.getMonth()===m.month&&activeCats.has(e.category)){
        byCat[e.category]=(byCat[e.category]||0)+e.amount;
        byPerson[e.person]=(byPerson[e.person]||0)+e.amount;
      }
    });
    const total=Object.values(byCat).reduce((s,v)=>s+v,0);
    return {...m,byCat,byPerson,total};
  });

  // Fixed stacking order: categories sorted by their overall total across all months (largest at bottom)
  const overallTotals={};
  data.forEach(m=>Object.entries(m.byCat).forEach(([cat,v])=>{overallTotals[cat]=(overallTotals[cat]||0)+v;}));
  const stackOrder=Object.entries(overallTotals).sort((a,b)=>b[1]-a[1]).map(([cat])=>cat);

  const rawMax=Math.max(...data.map(m=>m.total),1);
  const mag=Math.pow(10,Math.floor(Math.log10(rawMax)));
  const n=rawMax/mag;
  const maxVal=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  const W=340,H=210,padL=36,padB=22,padT=10;
  const chartW=W-padL,chartH=H-padB-padT;
  const colW=chartW/months.length;
  const barW=Math.min(30,colW*0.62);
  const nTicks=4;

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<=nTicks;i++){
    const y=padT+chartH-(chartH*i/nTicks);
    const v=maxVal*i/nTicks;
    const lbl=v>=1000?(v/1000).toFixed(1)+"k":Math.round(v);
    svg+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="#e8dfc8" stroke-width="1"/>`;
    svg+=`<text x="${(padL-4).toFixed(0)}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#8a7a5a">€${lbl}</text>`;
  }

  data.forEach((m,i)=>{
    const cx=padL+(i+0.5)*colW;
    const x=(cx-barW/2);
    const sorted=stackOrder.filter(cat=>m.byCat[cat]).map(cat=>[cat,m.byCat[cat]]);
    let stackY=padT+chartH;
    sorted.forEach(([cat,val])=>{
      const bh=(val/maxVal)*chartH;
      stackY-=bh;
      const color=CAT_COLORS[cat]||"#9e9e9e";
      svg+=`<rect x="${x.toFixed(1)}" y="${stackY.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}"/>`;
    });
    svg+=`<text x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#8a7a5a">${m.label}</text>`;
  });
  svg+="</svg>";

  const wrap=mk("div",{style:"background:var(--card);border:1px solid var(--border-d);border-radius:10px;padding:16px 8px 10px;margin-top:12px;"});
  wrap.innerHTML=svg;
  ip.append(wrap);

  // Monthly summary rows newest-first, showing total + person breakdown
  const summaryWrap=mk("div",{style:"margin-top:16px;"});
  [...data].reverse().forEach(m=>{
    if(!m.total) return;
    const lbl=new Date(m.year,m.month,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
    const row=mk("div",{style:"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-d);"});
    const right=mk("div",{style:"display:flex;align-items:center;gap:10px;"},
      mk("span",{style:"font-size:14px;font-weight:bold;color:var(--ink);"},"€"+m.total.toFixed(2)),
      ...PEOPLE.map((p,pi)=>m.byPerson[p]>0?
        mk("span",{cls:"insight-chip",style:`color:${pi===0?"#a07830":"#4a7a9b"}`},`${p===S.user?"You":p} €${m.byPerson[p].toFixed(2)}`):null
      ).filter(Boolean)
    );
    row.append(mk("span",{style:"font-size:13px;color:var(--ink-light);"},lbl),right);
    summaryWrap.append(row);
  });
  ip.append(summaryWrap);
}

function showMonthDropdown(anchor){
  const existing=document.getElementById("month-dd");
  if(existing){existing.remove();return;}

  for(let i=1;i<=6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const lbl=d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});

      style:`display:block;width:100%;padding:10px 16px;text-align:left;border:none;border-bottom:1px solid var(--sep);background:${isSelected?"var(--gold-light)":"transparent"};font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;`,

    const chips=PEOPLE.map((p,i)=>data.byPerson[p]>0?mk("span",{cls:"insight-chip",style:`color:${i===0?"#a07830":"#4a7a9b"}`},`${p===S.user?"You":p} €${data.byPerson[p].toFixed(2)}`):null).filter(Boolean);
    ip.append(mk("div",{cls:"insight-row"},
      mk("div",{cls:"insight-top"},mk("div",{cls:"insight-label"},mk("span",{cls:"insight-emoji"},emoji),mk("span",{cls:"insight-name"},name)),mk("div",{cls:"insight-amt-block"},mk("span",{cls:"insight-amt"},"€"+data.total.toFixed(2)),mk("span",{cls:"insight-pct"},pct+"%"))),
      mk("div",{cls:"bar-track"},...bars),

}

// ── Row gestures (shared) ─────────────────────────────────────────────────────
// One engine for list rows: tap, swipe → (colour), swipe ← (actions / full-swipe delete),
// long-press to lift → drag to reorder, or release in place → context menu.
const LP_MS=280, SWIPE_OPEN=148;
let _openRow=null, _closedAt=0;
const rubber=(x,lim)=>x<=lim?x:lim+(x-lim)*0.22;
function closeOpenRow(){ if(_openRow&&_openRow._close){ _openRow._close(); _closedAt=Date.now(); } _openRow=null; }
document.addEventListener("touchstart",e=>{ if(_openRow&&!_openRow.contains(e.target)) closeOpenRow(); },{passive:true,capture:true});
document.addEventListener("mousedown",e=>{ if(_openRow&&!_openRow.contains(e.target)) closeOpenRow(); },true);

function attachRowGestures(row,o){
  const front=row.querySelector(".srow-front"), actions=row.querySelector(".srow-actions"), colourBg=row.querySelector(".srow-colour");
  let st=null, lastTouch=0;

  row._close=()=>{
    front.style.transition="transform .38s cubic-bezier(.2,.9,.3,1.05)"; front.style.transform="";
    if(actions){ actions.style.transition="width .38s cubic-bezier(.2,.9,.3,1.05)"; actions.style.width="0px"; }
    setTimeout(()=>o.setBusy(false),380);
  };

  function start(x,y,target){
    if(target.closest(".srow-act,.row-edit")||Date.now()-_closedAt<60) return false;
    st={mode:"pending",x0:x,y0:y,x,y,target,fromHandle:!!target.closest(".sgrab"),
        openOffset:_openRow===row?-SWIPE_OPEN:0,tx:0,step:0,target_c:null,full:false};
    st.press=setTimeout(()=>row.classList.add("pressing"),110);
    if(o.canDrag||o.onMenu) st.lp=setTimeout(lift,LP_MS);
    return true;
  }
  function clearTimers(){ if(!st)return; clearTimeout(st.lp); clearTimeout(st.press); row.classList.remove("pressing"); }

  function move(x,y,ev){
    if(!st) return;
    st.x=x; st.y=y;
    const dx=x-st.x0, dy=y-st.y0;
    if(st.mode==="pending"){
      if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){
        clearTimers(); st.mode="swipe"; o.setBusy(true);
        front.style.transition="none"; if(actions) actions.style.transition="none";
        row.classList.add("swiping");
      } else if(Math.abs(dy)>6&&st.fromHandle&&o.canDrag){ clearTimers(); lift(); st.mode="drag"; row.style.transition="box-shadow .2s"; }
      else if(Math.abs(dy)>8){ clearTimers(); st=null; return; }
      else return;
    }
    if(ev&&ev.cancelable) ev.preventDefault();
    if(st.mode==="swipe") swipeTo(dx+st.openOffset);
    else { if(st.mode==="lift"&&o.canDrag&&Math.hypot(dx,dy)>6){ st.mode="drag"; row.style.transition="box-shadow .2s"; } if(st.mode==="drag") dragUpdate(); }
  }

  // ── swipe
  function paintColour(target,preview){
    colourBg.className="srow-colour "+(target||"")+(preview?" preview":"");
    colourBg.querySelector(".cname").textContent=o.colorName(target);
    colourBg.querySelectorAll(".cdots span").forEach((d,i)=>d.classList.toggle("on",o.colors[i]===target));
  }
  function swipeTo(tx){
    const w=row.offsetWidth;
    if(tx>0&&o.colors){
      if(actions) actions.style.width="0px";
      const cur=Math.max(0,o.colors.indexOf(o.getColor()));
      const step=tx<44?0:Math.min(o.colors.length-1,1+Math.floor((tx-44)/72));
      const target=o.colors[(cur+Math.max(step,1))%o.colors.length];
      if(step!==st.step){ if(step) haptic(); st.step=step; }
      paintColour(target,step===0); st.target_c=step?target:null;
      tx=rubber(tx,w*0.72);
    } else if(tx<0&&o.onDelete){
      const full=-tx>w*0.62;
      if(full!==st.full){ st.full=full; actions.classList.toggle("full",full); haptic(); }
      actions.style.width=(-tx)+"px";
    } else tx=tx>0?rubber(tx,0):-rubber(-tx,0);
    st.tx=tx; front.style.transform=`translateX(${tx}px)`;
  }
  function swipeEnd(s){
    const w=row.offsetWidth, ease="cubic-bezier(.2,.9,.3,1.08)";
    front.style.transition=`transform .42s ${ease}`; if(actions) actions.style.transition=`width .42s ${ease}`;
    if(s.tx>0){
      front.style.transform="";
      if(s.target_c!==null){
        haptic();
        row.classList.remove(...o.colors.filter(Boolean)); if(s.target_c) row.classList.add(s.target_c);
      }
      setTimeout(()=>{ row.classList.remove("swiping"); if(s.target_c!==null) o.setColor(s.target_c); o.setBusy(false); },380);
      return;
    }
    if(s.full){ front.style.transform=`translateX(${-w}px)`; actions.style.width=w+"px"; o.setBusy(false); o.onDelete(); return; }
    if(-s.tx>60&&o.onDelete){ front.style.transform=`translateX(${-SWIPE_OPEN}px)`; actions.style.width=SWIPE_OPEN+"px"; _openRow=row; return; }
    row._close(); if(_openRow===row) _openRow=null;
    setTimeout(()=>row.classList.remove("swiping"),400);
  }

  // ── lift & drag
  function lift(){
    clearTimeout(st.press); row.classList.remove("pressing");
    st.mode="lift"; haptic(); o.setBusy(true);
    const list=row.parentElement;
    st.rows=[...list.children].filter(n=>n.dataset.id);
    st.idx=st.rows.indexOf(row); st.cur=st.idx;
    st.tops=st.rows.map(r=>r.getBoundingClientRect().top+window.scrollY);
    st.hs=st.rows.map(r=>r.offsetHeight); st.h=st.hs[st.idx];
    st.scroll0=window.scrollY;
    row.classList.add("lifted");
    row.style.transition="transform .22s cubic-bezier(.3,1.5,.5,1), box-shadow .2s";
    row.style.transform="scale(1.03)";
    st.rows.forEach(r=>{ if(r!==row) r.style.transition="transform .3s cubic-bezier(.2,.9,.3,1.12)"; });
    const loop=()=>{
      if(!st||st.mode==="pending"||st.mode==="swipe") return;
      if(st.mode==="drag"){
        const top=90, bot=window.innerHeight-120; let v=0;
        if(st.y<top) v=-Math.min(14,(top-st.y)/5); else if(st.y>bot) v=Math.min(14,(st.y-bot)/5);
        if(v){ window.scrollBy(0,v); dragUpdate(); }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  function dragUpdate(){
    const n=st.rows.length;
    let dy=(st.y-st.y0)+(window.scrollY-st.scroll0);
    const minDy=st.tops[0]-st.tops[st.idx]-8, maxDy=st.tops[n-1]+st.hs[n-1]-st.h-st.tops[st.idx]+8;
    dy=Math.max(minDy,Math.min(maxDy,dy));
    row.style.transform=`translateY(${dy}px) scale(1.03)`;
    const center=st.tops[st.idx]+dy+st.h/2;
    let cur=0; st.rows.forEach((r,i)=>{ if(i!==st.idx&&st.tops[i]+st.hs[i]/2<center) cur++; });
    if(cur!==st.cur){
      st.cur=cur; haptic();
      st.rows.forEach((r,i)=>{
        if(i===st.idx) return;
        let shift=0;
        if(st.idx<cur&&i>st.idx&&i<=cur) shift=-st.h;
        if(st.idx>cur&&i<st.idx&&i>=cur) shift=st.h;
        r.style.transform=shift?`translateY(${shift}px)`:"";
      });
    }
  }
  function dropEnd(s){
    const cur=s.cur, idx=s.idx;
    const target=cur>idx?(s.tops[cur]+s.hs[cur]-s.h):s.tops[cur];
    row.style.transition="transform .34s cubic-bezier(.3,1.35,.5,1), box-shadow .3s";
    row.style.transform=`translateY(${target-s.tops[idx]}px)`;
    row.classList.remove("lifted");
    setTimeout(()=>{
      if(cur===idx){
        s.rows.forEach(r=>{ r.style.transition=""; r.style.transform=""; });
        o.setBusy(false); return;
      }
      haptic();
      const ids=s.rows.map(r=>r.dataset.id).filter(id=>id!==row.dataset.id);
      ids.splice(cur,0,row.dataset.id);
      o.onReorder(ids); o.setBusy(false);
    },340);
  }
  function menuEnd(){
    row.style.transition="transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s";
    row.style.transform=""; row.classList.remove("lifted");
    setTimeout(()=>{ row.style.transition=""; },260);
    o.setBusy(false);
    if(o.onMenu) o.onMenu();
  }

  function end(){
    if(!st) return false;
    clearTimers();
    const s=st; st=null;
    if(s.mode==="pending"){
      if(_openRow===row){ closeOpenRow(); return true; }
      if(s.target.closest("button")) return false; // let the button's own click through (e.g. the tick circle)
      if(o.onTap) o.onTap(s.target); return true;
    }
    if(s.mode==="swipe"){ swipeEnd(s); return true; }
    if(s.mode==="lift"){ menuEnd(); return true; }
    if(s.mode==="drag"){ dropEnd(s); return true; }
    return true;
  }
  function cancel(){
    if(!st) return; clearTimers();
    const s=st; st=null;
    if(s.mode==="swipe"){ s.tx=0; s.target_c=null; swipeEnd(s); }
    else if(s.mode==="lift"||s.mode==="drag"){ s.cur=s.idx; dropEnd(s); }
  }

  row.addEventListener("touchstart",e=>{ lastTouch=Date.now(); if(e.touches.length===1) start(e.touches[0].clientX,e.touches[0].clientY,e.target); },{passive:true});
  row.addEventListener("touchmove",e=>{ if(st) move(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
  row.addEventListener("touchend",e=>{ lastTouch=Date.now(); if(end()&&e.cancelable) e.preventDefault(); },{passive:false});
  row.addEventListener("touchcancel",cancel);
  row.addEventListener("mousedown",e=>{
    if(e.button!==0||Date.now()-lastTouch<800) return;
    if(!start(e.clientX,e.clientY,e.target)) return;
    const mm=ev=>move(ev.clientX,ev.clientY,ev);
    const mu=()=>{ window.removeEventListener("mousemove",mm); window.removeEventListener("mouseup",mu); end(); };
    window.addEventListener("mousemove",mm); window.addEventListener("mouseup",mu);
  });
}

// Long-press menu: blurred backdrop, lifted preview of the row, native-style action list.
function showRowMenu(row,{items,colors,current,colorName,onColor}){
  const r=row.getBoundingClientRect();
  const ov=mk("div",{cls:"ctx-overlay"});
  const preview=row.cloneNode(true);
  preview.classList.remove("lifted","pressing","swiping");
  preview.classList.add("ctx-preview");
  preview.removeAttribute("data-id"); preview.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;`;
  const menu=mk("div",{cls:"ctx-menu",role:"menu"});
  const close=()=>{ ov.classList.remove("show"); setTimeout(()=>ov.remove(),240); };
  const act=fn=>()=>{ close(); setTimeout(fn,120); };
  items.forEach((it,i)=>{
    if(it==="colors"){
      const row2=mk("div",{cls:"ctx-colors"});
      colors.forEach(c=>{
        const b=mk("button",{cls:c===current?"on":"","aria-label":colorName(c),style:`background:var(--${c||"c-none"})`,onClick:act(()=>onColor(c))});
        row2.append(b);
      });
      menu.append(row2); return;
    }
    const b=mk("button",{cls:"ctx-item"+(it.danger?" danger":"")+(it.gap?" gap":""),role:"menuitem",onClick:act(it.action)},mk("span",{},it.label));
    b.insertAdjacentHTML("beforeend",it.icon||"");
    menu.append(b);
  });
  ov.append(preview,menu);
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  document.body.append(ov);
  const mh=menu.offsetHeight, left=Math.min(r.left+4,window.innerWidth-254);
  const below=r.bottom+10+mh<window.innerHeight-20;
  menu.style.left=left+"px";
  menu.style.top=(below?r.bottom+10:Math.max(20,r.top-10-mh))+"px";
  menu.style.transformOrigin=below?"top left":"bottom left";
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add("show")));
}

// ── Shopping ──────────────────────────────────────────────────────────────────
const SHOP_COLORS=["","c-gold","c-blue","c-green"];
const COLOR_NAMES={"":"No colour","c-gold":"Amber","c-blue":"Blue","c-green":"Green"};
let _shopInpEl=null;
let _shopBusy=false,_shopRebuildPending=false;
const _shopPending=new Map(); // id → timer: ticked items wait a beat before moving to Completed

function shopSetBusy(b){ _shopBusy=b; if(!b&&_shopRebuildPending) rebuildShopList(); }

function refreshShopping(){
  const sp=el("section-shopping"); if(!sp) return;
  if(!_shopInpEl){
    let newItem="";
    _shopInpEl=mk("input",{cls:"add-input",type:"text",placeholder:"Add item",enterkeyhint:"done",autocomplete:"off",
      onInput:e=>newItem=e.target.value,
      onKeydown:e=>{if(e.key==="Enter"&&newItem.trim()) addItem();}
    });
    function addItem(){
      if(!newItem.trim()) return;
      const item={id:Date.now().toString(),text:newItem.trim(),done:false,color:"",createdAt:new Date().toISOString()};
      S.shopping=[item,...S.shopping]; _shopDirty=true;
      haptic();
      rebuildShopList();
      _shopInpEl.value=""; newItem="";
      setTimeout(()=>_shopInpEl.focus(),0);
      shopCommit();
    }
    const addBtn=mk("button",{cls:"add-btn",type:"button","aria-label":"Add item",onClick:addItem});
    addBtn.innerHTML=ICON.plus;
    sp.innerHTML="";
    sp.append(
      topBar("Shopping",mk("div",{cls:"large-sub"},mk("span",{cls:"live-dot synced","data-dot":"dot-shopping"}),mk("span",{id:"shop-count"}))),
      mk("div",{cls:"addfield"},_shopInpEl,addBtn),
      mk("div",{id:"shop-list-wrap"}),
    );
  }
  rebuildShopList();
}

function rebuildShopList(){
  const wrap=el("shop-list-wrap"); if(!wrap) return;
  const ae=document.activeElement;
  if(_shopBusy||(ae&&ae.classList.contains("row-edit")&&wrap.contains(ae))){ _shopRebuildPending=true; return; }
  _shopRebuildPending=false;
  if(_openRow&&wrap.contains(_openRow)) _openRow=null;
  const prev=flipSnapshot(wrap);
  const active=S.shopping.filter(i=>!i.done), done=S.shopping.filter(i=>i.done);
  const cnt=el("shop-count");
  if(cnt) cnt.textContent=!S.shopping.length?"Synced with "+PEOPLE.find(p=>p!==S.user):active.length?`${active.length} item${active.length===1?"":"s"} to get`:"All done";
  wrap.innerHTML="";
  if(!S.shopping.length){ wrap.append(mk("div",{cls:"empty-state"},mk("div",{cls:"empty-emoji"},"🧺"),"Nothing on the list")); return; }
  if(active.length){
    const g=mk("div",{cls:"group",id:"shop-active"});
    active.forEach(it=>g.append(shopRow(it,true)));
    wrap.append(g);
  }
  if(done.length){
    const collapsed=ls.get("shop_done_collapsed")==="1";
    const tog=mk("button",{cls:"group-toggle"+(collapsed?" collapsed":""),onClick:()=>{ls.set("shop_done_collapsed",collapsed?"0":"1");rebuildShopList();}});
    tog.innerHTML=ICON.chevron; tog.append(`Completed · ${done.length}`);
    wrap.append(mk("div",{cls:"group-head"},tog,mk("button",{cls:"group-action",onClick:clearDoneShopping},"Clear")));
    if(!collapsed){
      const g=mk("div",{cls:"group",id:"shop-done"});
      done.forEach(it=>g.append(shopRow(it,false)));
      wrap.append(g);
    }
  }
  flipPlay(wrap,prev);
}

function shopRow(item,isActive){
  const ticking=_shopPending.has(item.id);
  const row=mk("div",{cls:"srow"+(item.color?" "+item.color:"")+(item.done||ticking?" done":"")});
  row.dataset.id=item.id;
  const colourBg=mk("div",{cls:"srow-colour"},mk("span",{cls:"cdots"},...SHOP_COLORS.map(()=>mk("span"))),mk("span",{cls:"cname"}));
  const editBtn=mk("button",{cls:"srow-act",style:"background:#8E8E93",onClick:()=>{closeOpenRow();startShopEdit(row,item);}});
  editBtn.innerHTML=ICON.pencil+"<span>Edit</span>"; editBtn.classList.add("act-edit");
  const delBtn=mk("button",{cls:"srow-act act-del",onClick:()=>deleteShopItem(row,item)});
  delBtn.innerHTML=ICON.trash+"<span>Delete</span>";
  const check=mk("button",{cls:"scheck","aria-label":item.done?"Mark as not done":"Mark as done",onClick:e=>{e.stopPropagation();toggleShopItem(row,item);}});
  const front=mk("div",{cls:"srow-front"},check,mk("span",{cls:"stext"},mk("span",{cls:"stext-inner"},item.text)));
  if(isActive) front.append(mk("span",{cls:"sgrab","aria-hidden":"true"},mk("i"),mk("i"),mk("i")));
  row.append(colourBg,mk("div",{cls:"srow-actions"},editBtn,delBtn),front);
  const setColor=c=>shopWrite(S.shopping.map(x=>x.id===item.id?{...x,color:c}:x));
  attachRowGestures(row,{
    canDrag:isActive,
    colors:SHOP_COLORS, colorName:c=>COLOR_NAMES[c], getColor:()=>item.color||"", setColor,
    setBusy:shopSetBusy,
    onTap:t=>{ if(t.closest(".stext")) startShopEdit(row,item); },
    onDelete:()=>deleteShopItem(row,item),
    onReorder:ids=>{
      const byId=Object.fromEntries(S.shopping.map(x=>[x.id,x]));
      const moved=ids.map(id=>byId[id]).filter(Boolean);
      shopWrite([...moved,...S.shopping.filter(x=>!ids.includes(x.id))]);
    },
    onMenu:()=>showRowMenu(row,{
      colors:SHOP_COLORS, current:item.color||"", colorName:c=>COLOR_NAMES[c], onColor:setColor,
      items:[
        {label:"Edit",icon:ICON.pencil,action:()=>startShopEdit(row,item)},
        "colors",
        ...(isActive?[{label:"Move to top",icon:ICON.up,action:()=>shopWrite([item,...S.shopping.filter(x=>x.id!==item.id)])}]:[]),
        {label:"Delete",icon:ICON.trash,danger:true,gap:true,action:()=>deleteShopItem(row,item)},
      ],
    }),
  });
  return row;
}

function toggleShopItem(row,item){
  if(item.done){ haptic(); shopWrite(S.shopping.map(x=>x.id===item.id?{...x,done:false}:x)); return; }
  if(_shopPending.has(item.id)){
    clearTimeout(_shopPending.get(item.id)); _shopPending.delete(item.id);
    row.classList.remove("done","ticking"); return;
  }
  haptic();
  row.classList.add("done","ticking");
  _shopPending.set(item.id,setTimeout(()=>{
    _shopPending.delete(item.id);
    if(S.shopping.some(x=>x.id===item.id)) shopWrite(S.shopping.map(x=>x.id===item.id?{...x,done:true}:x));
  },900));
}

function deleteShopItem(row,item){
  const idx=S.shopping.findIndex(x=>x.id===item.id); if(idx<0) return;
  haptic();
  shopSetBusy(true);
  collapseRow(row,()=>{
    shopSetBusy(false);
    shopWrite(S.shopping.filter(x=>x.id!==item.id));
    toast(`Deleted “${item.text}”`,"Undo",()=>{
      if(S.shopping.some(x=>x.id===item.id)) return;
      const arr=[...S.shopping]; arr.splice(Math.min(idx,arr.length),0,item); shopWrite(arr);
    });
  });
}

function clearDoneShopping(){
  const removed=S.shopping.filter(x=>x.done); if(!removed.length) return;
  haptic();
  shopWrite(S.shopping.filter(x=>!x.done));
  toast(`Cleared ${removed.length} item${removed.length===1?"":"s"}`,"Undo",()=>{
    shopWrite([...S.shopping,...removed.filter(d=>!S.shopping.some(x=>x.id===d.id))]);
  });
}

function startShopEdit(row,item){
  const text=row.querySelector(".stext"); if(!text) return;
  const inp=mk("input",{cls:"row-edit",type:"text",enterkeyhint:"done"});
  inp.value=item.text;
  text.replaceWith(inp); inp.focus();
  try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){}
  let finished=false;
  inp.addEventListener("blur",()=>{
    if(finished) return; finished=true;
    const v=inp.value.trim();
    if(v&&v!==item.text) shopWrite(S.shopping.map(x=>x.id===item.id?{...x,text:v}:x));
    else rebuildShopList();
  });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") inp.blur(); if(e.key==="Escape"){ inp.value=item.text; inp.blur(); } });
}

// ── Blackboard ────────────────────────────────────────────────────────────────
const BOARD_COLORS=["","c-gold","c-blue","c-green"];
let _boardInpEl=null;

function refreshBoard(){
  const bp=el("section-blackboard"); if(!bp) return;
  if(_boardInpEl){rebuildBoard();return;}
  _boardInpEl=mk("textarea",{cls:"board-input",placeholder:"New note…",rows:"2",
    onInput:e=>{_boardInpEl._val=e.target.value;e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}
  });
  _boardInpEl._val="";
  const addBtn=mk("button",{cls:"shop-add-btn",type:"button",onClick:addNote},"+");
  async function addNote(){
    const text=(_boardInpEl._val||"").trim(); if(!text) return;
    const note={id:Date.now().toString(),text,color:"",person:S.user,createdAt:new Date().toISOString()};
    S.blackboard=[note,...S.blackboard]; _boardDirty=true;
    rebuildBoard();
    _boardInpEl.value=""; _boardInpEl._val=""; _boardInpEl.style.height=""; _boardInpEl.focus();
    boardCommit();
  }
  bp.innerHTML="";
  bp.append(topBar("Board",mk("div",{cls:"large-sub"},mk("span",{cls:"live-dot synced","data-dot":"dot-board"}),mk("span",{},"Shared notes"))));
  const wrap=mk("div",{cls:"body",id:"board-wrap"},
    mk("div",{cls:"board-input-row"},_boardInpEl,addBtn),
    mk("div",{id:"board-list-wrap"})
  );
  bp.append(wrap);
  rebuildBoard();
}

function rebuildBoard(){
  const wrap=el("board-list-wrap"); if(!wrap) return;
  wrap.innerHTML="";
  if(!S.blackboard.length){wrap.append(mk("p",{cls:"empty"},"Board is empty."));return;}
  const listEl=mk("div",{id:"board-list"});
  let dragSrc=null;

  S.blackboard.forEach(note=>{
    const isMine=note.person===S.user;
    const color=note.color||"";
    const row=mk("div",{cls:"board-note"+(color?" "+color:"")});
    row.dataset.id=note.id;
    const handle=mk("span",{cls:"board-note-handle"},"⠿");
    handle.addEventListener("touchstart",e=>{e.stopPropagation();dragSrc=row;row.classList.add("dragging");},{passive:true});
    let expanded=false,editing=false;
    const textEl=mk("div",{cls:"board-note-text"},note.text);
    const metaEl=mk("div",{cls:"board-note-meta"},(note.person===S.user?"You":note.person)+" · "+fmtDate(note.createdAt.slice(0,10)));
    const moreBtn=mk("button",{cls:"board-more"},"more");
    const actionsRow=mk("div",{cls:"board-note-actions"},moreBtn);
    moreBtn.style.display="none";
    moreBtn.addEventListener("click",()=>{
      expanded=!expanded;
      textEl.classList.toggle("expanded",expanded);
      moreBtn.textContent=expanded?"less":"more";
    });
    if(isMine){
      textEl.addEventListener("click",()=>{
        if(editing)return; editing=true; expanded=true;
        const ta=mk("textarea",{cls:"board-note-text editing"});
        ta.value=note.text; ta.style.height="auto";
        setTimeout(()=>{ta.style.height=ta.scrollHeight+"px";},0);
        ta.addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";});
        ta.addEventListener("blur",async()=>{
          const newText=ta.value.trim(); editing=false;
          if(newText&&newText!==note.text) await boardWrite(S.blackboard.map(n=>n.id===note.id?{...n,text:newText}:n));
          else rebuildBoard();
        });
        textEl.replaceWith(ta); ta.focus(); moreBtn.style.display="none";
      });
    }
    if(isMine){
      let swipeX=null;
      row.addEventListener("touchstart",e=>{if(e.target===handle)return;swipeX=e.touches[0].clientX;},{passive:true});
      row.addEventListener("touchend",e=>{
        if(swipeX===null||e.target===handle)return;
        const dx=e.changedTouches[0].clientX-swipeX;
        if(Math.abs(dx)<40){swipeX=null;return;}
        const cur=BOARD_COLORS.indexOf(note.color||"");
        const next=dx>0?(cur+1)%BOARD_COLORS.length:(cur-1+BOARD_COLORS.length)%BOARD_COLORS.length;
        swipeX=null;
        boardWrite(S.blackboard.map(n=>n.id===note.id?{...n,color:BOARD_COLORS[next]}:n));
      },{passive:true});
    }
    const noteBody=mk("div",{cls:"board-note-body"},textEl,metaEl,actionsRow);
    const del=isMine?mk("button",{cls:"board-del",onClick:async()=>{
      await boardWrite(S.blackboard.filter(n=>n.id!==note.id));
    }},"×"):null;
    row.append(handle,noteBody);
    if(del) row.append(del);
    listEl.append(row);
  });

  listEl.addEventListener("touchmove",e=>{
    if(!dragSrc)return; e.preventDefault();
    const touch=e.touches[0];
    const els=[...listEl.querySelectorAll(".board-note:not(.dragging)")];
    els.forEach(el=>el.classList.remove("drag-over"));
    const target=els.find(el=>{const r=el.getBoundingClientRect();return touch.clientY>=r.top&&touch.clientY<=r.bottom;});
    if(target) target.classList.add("drag-over");
  },{passive:false});
  listEl.addEventListener("touchend",async()=>{
    if(!dragSrc)return; dragSrc.classList.remove("dragging");
    const over=listEl.querySelector(".drag-over");
    if(over&&over!==dragSrc){
      over.classList.remove("drag-over");
      const ids=S.blackboard.map(n=>n.id);
      const srcIdx=ids.indexOf(dragSrc.dataset.id);
      const tgtIdx=ids.indexOf(over.dataset.id);
      const reordered=[...S.blackboard];
      const [moved]=reordered.splice(srcIdx,1);
      reordered.splice(tgtIdx,0,moved);
      await boardWrite(reordered);
    } else { listEl.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over")); }
    dragSrc=null;
  });

  wrap.append(listEl);
  requestAnimationFrame(()=>{
    listEl.querySelectorAll(".board-note-text").forEach(t=>{
      const btn=t.closest(".board-note-body")?.querySelector(".board-more");
      if(btn && t.scrollHeight>t.clientHeight+2) btn.style.display="";
    });
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderRoot();
if(S.user){
  ensureAuth().then(()=>{ startListeners(); setupFCM(); })
    .catch(e=>{ S.loading=false; S.loadErr="Sign-in failed: "+e.message; refreshHistory(); });
}

// Firestore's realtime stream can stall silently (backgrounded tab, network
// switch) without ever calling the onSnapshot error callback — nudge it back
// to life whenever the app regains focus or connectivity.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.user) startListeners();
});
window.addEventListener("online", () => { if (S.user) startListeners(); });
</script>
</body>
